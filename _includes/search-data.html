<script id="search-data" type="application/json">
[
{% assign search_items = site.guides | concat: site.projects %}
{% for item in search_items %}
  {
    "title": {{ item.title | jsonify }},
    "meta": {% if item.collection == 'guides' %}{{ item.project | default: item.category | jsonify }}{% else %}"Project"{% endif %},
    "description": {{ item.description | default: item.excerpt | strip_html | strip_newlines | jsonify }},
    "url": {{ item.url | relative_url | jsonify }}
  }{% unless forloop.last %},{% endunless %}
{% endfor %}
]
</script>
