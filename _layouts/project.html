---
layout: default
---
<section class="page-hero"><div class="wrap"><p class="eyebrow">Project library</p><h1>{{ page.title }}</h1><p>{{ page.description }}</p><a class="button" href="{{ page.repository }}">View repository</a></div></section><article class="prose wrap">{{ content }}<h2>Related guides</h2><div class="guide-list">{% assign related = site.guides | where: 'project', page.title %}{% for guide in related %}<a href="{{ guide.url | relative_url }}"><span>{{ guide.category }}</span><strong>{{ guide.title }}</strong></a>{% endfor %}</div></article>
