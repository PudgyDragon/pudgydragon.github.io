title: PudgyDragon
description: Cybersecurity engineering, threat intelligence, blue-team implementation, troubleshooting, and DoD STIG guides.
url: "https://pudgydragon.github.io"
baseurl: ""
markdown: kramdown
highlighter: rouge
permalink: pretty
collections:
  guides:
    output: true
    permalink: /guides/:name/
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  - scope: {path: "", type: guides}
    values: {layout: guide}
  - scope: {path: "", type: projects}
    values: {layout: project}
plugins:
  - jekyll-seo-tag
exclude: [vendor, node_modules, README.md]
